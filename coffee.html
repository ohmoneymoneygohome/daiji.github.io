<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>买一杯咖啡 - 小憩</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --coffee-dark: #3d2914;
            --coffee-medium: #6b4423;
            --coffee-light: #8b5a2b;
            --cream: #f5e6d3;
            --cream-dark: #e8d5b7;
            --accent: #d4a574;
            --text-dark: #2c1810;
            --text-light: #5c4033;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--cream) 0%, var(--cream-dark) 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(245, 230, 211, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            padding: 15px 0;
            transition: all 0.3s ease;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo img {
            height: 35px;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 400;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-links a:hover {
            color: var(--coffee-medium);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--coffee-medium);
            transition: width 0.3s ease;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--coffee-dark);
        }

        .hero-section {
            padding: 150px 0 100px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero-section::before {
            content: '';
            position: absolute;
            top: 20%;
            left: 10%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(212, 165, 116, 0.3) 0%, transparent 70%);
            animation: float 6s ease-in-out infinite;
        }

        .hero-section::after {
            content: '';
            position: absolute;
            bottom: 20%;
            right: 10%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(139, 90, 43, 0.2) 0%, transparent 70%);
            animation: float 8s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .hero-title {
            font-size: 48px;
            font-weight: 300;
            color: var(--coffee-dark);
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .hero-subtitle {
            font-size: 18px;
            color: var(--text-light);
            max-width: 600px;
            margin: 0 auto 40px;
            line-height: 1.8;
        }

        .coffee-icon {
            font-size: 80px;
            margin-bottom: 30px;
            animation: brew 3s ease-in-out infinite;
        }

        @keyframes brew {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .support-section {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(61, 41, 20, 0.1);
            position: relative;
            z-index: 1;
        }

        .section-title {
            font-size: 28px;
            font-weight: 400;
            color: var(--coffee-dark);
            text-align: center;
            margin-bottom: 30px;
        }

        .amount-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .amount-btn {
            padding: 20px;
            border: 2px solid var(--cream-dark);
            background: white;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 20px;
            font-weight: 500;
            color: var(--text-dark);
        }

        .amount-btn:hover {
            border-color: var(--accent);
            background: var(--cream);
            transform: translateY(-3px);
        }

        .amount-btn.selected {
            border-color: var(--coffee-medium);
            background: var(--coffee-medium);
            color: white;
        }

        .custom-amount {
            margin-bottom: 30px;
        }

        .custom-amount label {
            display: block;
            margin-bottom: 10px;
            color: var(--text-light);
            font-size: 14px;
        }

        .custom-amount input {
            width: 100%;
            padding: 15px;
            border: 2px solid var(--cream-dark);
            border-radius: 10px;
            font-size: 18px;
            text-align: center;
            transition: border-color 0.3s ease;
        }

        .custom-amount input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .submit-btn {
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, var(--coffee-medium) 0%, var(--coffee-light) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(107, 68, 35, 0.3);
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(107, 68, 35, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .supportors-section {
            margin-top: 100px;
            padding: 60px 0;
            background: rgba(255, 255, 255, 0.5);
        }

        .supportors-title {
            font-size: 24px;
            font-weight: 400;
            color: var(--coffee-dark);
            text-align: center;
            margin-bottom: 40px;
        }

        .supportors-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .supportor-card {
            background: white;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(61, 41, 20, 0.08);
            transition: all 0.3s ease;
        }

        .supportor-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(61, 41, 20, 0.12);
        }

        .supportor-name {
            font-weight: 500;
            color: var(--coffee-dark);
        }

        .supportor-amount {
            font-size: 14px;
            color: var(--text-light);
            margin-top: 5px;
        }

        footer {
            padding: 60px 0;
            background: var(--coffee-dark);
            color: white;
            text-align: center;
            margin-top: 100px;
        }

        .footer-content {
            max-width: 800px;
            margin: 0 auto;
        }

        .footer-logo {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
        }

        .footer-links a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .footer-links a:hover {
            color: white;
        }

        .footer-copyright {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: var(--cream);
                flex-direction: column;
                align-items: center;
                padding: 20px 0;
                gap: 20px;
                box-shadow: 0 10px 10px rgba(0, 0, 0, 0.05);
            }

            .nav-links.active {
                display: flex;
            }

            .mobile-menu-btn {
                display: block;
            }

            .hero-title {
                font-size: 36px;
            }

            .amount-options {
                grid-template-columns: repeat(2, 1fr);
            }

            .support-section {
                padding: 30px 20px;
                margin: 0 20px;
            }
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: var(--accent);
            border-radius: 50%;
            pointer-events: none;
            animation: confetti-fall 3s linear forwards;
        }

        @keyframes confetti-fall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="img/小憩logo.png" alt="小憩">
            </a>
            <div class="nav-links" id="navLinks">
                <a href="home.html">首页</a>
                <a href="index.html">播客</a>
                <a href="space.html">空间合作</a>
                <a href="sponsor.html">商务赞助</a>
                <a href="coffee.html">买一杯咖啡</a>
                <a href="about.html">关于我们</a>
                <a href="contact.html">联系我们</a>
            </div>
            <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
        </div>
    </nav>

    <section class="hero-section">
        <div class="coffee-icon">☕</div>
        <h1 class="hero-title">买一杯咖啡</h1>
        <p class="hero-subtitle">
            如果《小憩》曾给您带来片刻的宁静与思考，<br>
            不妨请我们喝一杯咖啡，支持我们继续前行。
        </p>

        <div class="support-section">
            <h2 class="section-title">选择您想支持的金额</h2>
            
            <div class="amount-options" id="amountOptions">
                <button class="amount-btn" data-amount="10">¥10</button>
                <button class="amount-btn" data-amount="20">¥20</button>
                <button class="amount-btn" data-amount="30">¥30</button>
                <button class="amount-btn" data-amount="50">¥50</button>
                <button class="amount-btn" data-amount="100">¥100</button>
                <button class="amount-btn" data-amount="200">¥200</button>
            </div>

            <div class="custom-amount">
                <label for="customAmount">其他金额</label>
                <input type="number" id="customAmount" placeholder="输入金额" min="1">
            </div>

            <button class="submit-btn" id="supportBtn">支持小憩</button>
        </div>
    </section>

    <section class="supportors-section">
        <h2 class="supportors-title">感谢这些朋友的支持</h2>
        <div class="supportors-grid" id="supportorsGrid">
            <div class="supportor-card">
                <div class="supportor-name">阳光</div>
                <div class="supportor-amount">¥50</div>
            </div>
            <div class="supportor-card">
                <div class="supportor-name">清风</div>
                <div class="supportor-amount">¥30</div>
            </div>
            <div class="supportor-card">
                <div class="supportor-name">明月</div>
                <div class="supportor-amount">¥100</div>
            </div>
            <div class="supportor-card">
                <div class="supportor-name">星辰</div>
                <div class="supportor-amount">¥20</div>
            </div>
            <div class="supportor-card">
                <div class="supportor-name">小雨</div>
                <div class="supportor-amount">¥50</div>
            </div>
            <div class="supportor-card">
                <div class="supportor-name">云朵</div>
                <div class="supportor-amount">¥30</div>
            </div>
        </div>
    </section>

    <footer>
        <div class="footer-content">
            <div class="footer-logo">小憩</div>
            <div class="footer-links">
                <a href="home.html">首页</a>
                <a href="space.html">空间合作</a>
                <a href="sponsor.html">商务赞助</a>
                <a href="coffee.html">买一杯咖啡</a>
                <a href="about.html">关于我们</a>
                <a href="contact.html">联系我们</a>
            </div>
            <div class="footer-copyright">© 2026 小憩. 世界不停，我们小憩</div>
        </div>
    </footer>

    <script>
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const navLinks = document.getElementById('navLinks');

        mobileMenuBtn.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });

        const amountOptions = document.querySelectorAll('.amount-btn');
        const customAmount = document.getElementById('customAmount');
        const supportBtn = document.getElementById('supportBtn');
        let selectedAmount = null;

        amountOptions.forEach(btn => {
            btn.addEventListener('click', () => {
                amountOptions.forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedAmount = parseInt(btn.dataset.amount);
                customAmount.value = '';
            });
        });

        customAmount.addEventListener('input', () => {
            amountOptions.forEach(b => b.classList.remove('selected'));
            selectedAmount = customAmount.value ? parseInt(customAmount.value) : null;
        });

        supportBtn.addEventListener('click', () => {
            const amount = selectedAmount || (customAmount.value ? parseInt(customAmount.value) : null);
            
            if (!amount || amount <= 0) {
                alert('请选择或输入支持金额');
                return;
            }

            createConfetti();
            
            alert(`感谢您的支持！¥${amount}\n\n您的支持是我们继续创作的动力。`);
        });

        function createConfetti() {
            for (let i = 0; i < 30; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = ['#d4a574', '#8b5a2b', '#6b4423', '#f5e6d3'][Math.floor(Math.random() * 4)];
                confetti.style.width = Math.random() * 15 + 5 + 'px';
                confetti.style.height = confetti.style.width;
                confetti.style.animationDelay = Math.random() * 2 + 's';
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                document.body.appendChild(confetti);

                setTimeout(() => {
                    confetti.remove();
                }, 3000);
            }
        }

        window.addEventListener('scroll', () => {
            const nav = document.querySelector('nav');
            if (window.scrollY > 50) {
                nav.style.boxShadow = '0 2px 15px rgba(61, 41, 20, 0.1)';
            } else {
                nav.style.boxShadow = 'none';
            }
        });
    </script>
</body>
</html>
